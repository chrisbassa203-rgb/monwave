<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MonWave - Démonstration</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Arial,sans-serif;background:#f2f7f5;color:#173b30}

header{background:#075e4b;color:white;padding:24px 20px;border-radius:0 0 25px 25px}

header h1{margin:0;font-size:27px}

header p{margin:8px 0 0;font-size:13px}

main{max-width:480px;margin:auto;padding:20px}

.balance{background:#087e63;color:white;padding:25px;border-radius:20px}

.balance p{margin:0;font-size:14px}

.balance h2{font-size:32px;margin:15px 0}

.tag{font-size:12px;background:#d9f5e8;color:#075e4b;padding:7px 12px;border-radius:20px;display:inline-block}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}

.action{background:white;border:0;border-radius:16px;padding:18px 5px;color:#075e4b;font-weight:bold;cursor:pointer}

.action span{display:block;font-size:25px;margin-bottom:10px}

h3{font-size:18px}

.transaction{background:white;padding:17px;border-radius:15px;margin:10px 0;display:flex;justify-content:space-between;gap:10px}

.transaction small{display:block;color:#777;margin-top:5px}

.notice{font-size:12px;color:#666;text-align:center;margin-top:25px}

</style>

</head>

<body>

<header>

<h1>monwave</h1>

<p>Votre argent, simplement.</p>

</header>

<main>

<div class="balance">

<p>Solde de démonstration</p>

<h2 id="solde">25 000 FCFA</h2>

<span class="tag">Mode démo · Argent fictif</span>

</div>

<div class="actions">

<button class="action" onclick="demo('Envoyer')"><span>↗</span>Envoyer</button>

<button class="action" onclick="demo('retrait')"><span>↙</span>Recevoir</button>

<button class="action" onclick="demo('Recharger')"><span>＋</span>Recharger</button>

</div>

<h3>Activité récente</h3>

<div class="transaction">

<div>Transfert de démonstration<small>Aujourd'hui</small></div>

<strong>− 2 000 F</strong>

</div>

<div class="transaction">

<div>Recharge de démonstration<small>Hier</small></div>

<strong>+ 5 000 F</strong>

</div>

<p class="notice">MonWave est une maquette fictive. Aucun transfert ni paiement réel n'est effectué.</p>

</main>

<script>

function demo(action){
  if(action.toLowerCase().includes("envoyer")){
    let numero = prompt("Entre le numéro du destinataire :");
    if(!numero) return;
    let montant = prompt("Entre le montant fictif à envoyer en FCFA :");
    if(!montant || isNaN(montant) || Number(montant) <= 0){
      alert("Montant invalide.");
      return;
    }
    alert("Simulation réussie !\nDestinataire : " + numero + "\nMontant : " + montant + " FCFA\nAucun argent réel n'a été transféré.");
  } else {
    alert(action + " : cette fonction est encore en démonstration.");
  }
}</script>

</body>

</html>
