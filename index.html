<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonWave</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #18a957;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .balance {
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .balance p {
      margin: 5px;
      color: #777;
    }

    .balance h2 {
      margin: 10px 0;
      font-size: 32px;
      color: #18a957;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      background: #18a957;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .history-item {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .qr {
      text-align: center;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .hidden {
      display: none;
    }

    .demo {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>MonWave</h1>
  <p>Transfert d'argent</p>
</header>

<div class="container">

  <div class="balance">
    <p>Solde disponible</p>
    <h2 id="balance">50 000 FCFA</h2>
  </div>

  <div class="buttons">
    <button onclick="showSection('send')">Envoyer</button>
    <button onclick="showSection('withdraw')">Retrait</button>
    <button onclick="showSection('history')">Historique</button>
    <button onclick="showSection('qr')">Mon QR</button>
  </div>

  <!-- ENVOYER -->
  <div id="send" class="card hidden">
    <h3>Envoyer de l'argent</h3>

    <input id="sendNumber" type="tel" placeholder="Numéro du destinataire">
    <input id="sendAmount" type="number" placeholder="Montant en FCFA">

    <button onclick="sendMoney()">Envoyer</button>
  </div>

  <!-- RETRAIT -->
  <div id="withdraw" class="card hidden">
    <h3>Retrait</h3>

    <input id="withdrawAmount" type="number" placeholder="Montant en FCFA">

    <button onclick="withdrawMoney()">Retirer</button>
  </div>

  <!-- HISTORIQUE -->
  <div id="history" class="card hidden">
    <h3>Historique</h3>

    <div id="historyList">
      <p>Aucune opération pour le moment.</p>
    </div>
  </div>

  <!-- QR CODE -->
  <div id="qr" class="card qr hidden">
    <h3>Mon QR code</h3>

    <p>Scanne ce QR code avec un téléphone.</p>

    <div id="qrcode"></div>

    <p>QR MonWave - Démonstration</p>
  </div>

  <p class="demo">
    Version de démonstration — aucun transfert réel.
  </p>

</div>

<script>

  let balance = 50000;
  let history = [];

  function updateBalance() {
    document.getElementById("balance").textContent =
      balance.toLocaleString("fr-FR") + " FCFA";
  }

  function showSection(section) {

    document.getElementById("send").classList.add("hidden");
    document.getElementById("withdraw").classList.add("hidden");
    document.getElementById("history").classList.add("hidden");
    document.getElementById("qr").classList.add("hidden");

    document.getElementById(section).classList.remove("hidden");

    if (section === "history") {
      renderHistory();
    }

    if (section === "qr") {
      generateQR();
    }
  }

  function sendMoney() {

    let number = document.getElementById("sendNumber").value;
    let amount = Number(document.getElementById("sendAmount").value);

    if (!number || !amount || amount <= 0) {
      alert("Remplis correctement les informations.");
      return;
    }

    if (amount > balance) {
      alert("Solde insuffisant.");
      return;
    }

    balance -= amount;

    history.unshift({
      type: "Envoi",
      details: number,
      amount: amount
    });

    updateBalance();

    document.getElementById("sendNumber").value = "";
    document.getElementById("sendAmount").value = "";

    alert("Envoi effectué dans la démonstration.");
  }

  function withdrawMoney() {

    let amount = Number(document.getElementById("withdrawAmount").value);

    if (!amount || amount <= 0) {
      alert("Entre un montant valide.");
      return;
    }

    if (amount > balance) {
      alert("Solde insuffisant.");
      return;
    }

    balance -= amount;

    history.unshift({
      type: "Retrait",
      details: "Retrait MonWave",
      amount: amount
    });

    updateBalance();

    document.getElementById("withdrawAmount").value = "";

    alert("Retrait effectué dans la démonstration.");
  }

  function renderHistory() {

    let list = document.getElementById("historyList");

    if (history.length === 0) {
      list.innerHTML = "<p>Aucune opération pour le moment.</p>";
      return;
    }

    list.innerHTML = "";

    history.forEach(function(operation) {

      let item = document.createElement("div");
      item.className = "history-item";

      item.innerHTML =
        "<strong>" + operation.type + "</strong><br>" +
        operation.details + "<br>" +
        "<b>" + operation.amount.toLocaleString("fr-FR") + " FCFA</b>";

      list.appendChild(item);
    });
  }

  function generateQR() {

    let qr = document.getElementById("qrcode");

    qr.innerHTML = "";

    new QRCode(qr, {
      text: "MonWave - Compte de démonstration",
      width: 200,
      height: 200
    });
  }

  updateBalance();

</script>

</body>
</html>
