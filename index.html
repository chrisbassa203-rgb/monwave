<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MonWave</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f7fb;
  color: #172033;
  min-height: 100vh;
}

.app {
  max-width: 480px;
  margin: auto;
  min-height: 100vh;
  background: #fff;
  box-shadow: 0 0 30px rgba(0,0,0,.08);
}

header {
  background: linear-gradient(135deg, #087fdf, #005bbb);
  color: white;
  padding: 28px 22px 35px;
  border-radius: 0 0 28px 28px;
}

.brand {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 25px;
}

.demo {
  font-size: 11px;
  background: rgba(255,255,255,.18);
  padding: 5px 9px;
  border-radius: 20px;
  display: inline-block;
  margin-left: 5px;
}

.balance-label {
  opacity: .85;
  font-size: 14px;
}

.balance {
  font-size: 36px;
  font-weight: bold;
  margin-top: 7px;
}

.main {
  padding: 22px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 28px;
}

.action {
  border: none;
  border-radius: 18px;
  padding: 20px 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.action:hover {
  transform: translateY(-2px);
}

.send {
  background: #087fdf;
  color: white;
}

.withdraw {
  background: #eaf3ff;
  color: #087fdf;
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 14px;
}

.history {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.transaction {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
  border: 1px solid #edf0f5;
  border-radius: 15px;
  background: #fff;
}

.left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf6ff;
  font-size: 19px;
}

.name {
  font-weight: bold;
  font-size: 14px;
}

.date {
  color: #8993a4;
  font-size: 12px;
  margin-top: 4px;
}

.amount {
  font-weight: bold;
  font-size: 14px;
}

.empty {
  text-align: center;
  color: #8c96a6;
  padding: 35px 10px;
}

footer {
  text-align: center;
  color: #a0a8b5;
  font-size: 11px;
  padding: 30px 10px;
}

/* Fenêtre */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
}

.modal-box {
  width: 100%;
  max-width: 480px;
  background: white;
  border-radius: 25px 25px 0 0;
  padding: 25px 22px 30px;
  animation: slideUp .25s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #dfe5ed;
  border-radius: 13px;
  font-size: 16px;
  outline: none;
  margin-bottom: 12px;
}

input:focus {
  border-color: #087fdf;
}

.confirm {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: #087fdf;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.cancel {
  width: 100%;
  margin-top: 9px;
  padding: 13px;
  border: none;
  background: transparent;
  color: #697386;
  cursor: pointer;
}

.message {
  margin-bottom: 12px;
  padding: 11px;
  border-radius: 10px;
  background: #fff0f0;
  color: #c62828;
  font-size: 13px;
  display: none;
}

@media (min-width: 600px) {
  body {
    padding: 25px 0;
  }

  .app {
    border-radius: 25px;
    overflow: hidden;
    min-height: calc(100vh - 50px);
  }

  .modal {
    align-items: center;
  }

  .modal-box {
    border-radius: 25px;
  }
}
</style>
</head>
  <div class="modal" id="qrModal">
  <div class="modal-box" style="text-align:center;">
    <div class="modal-title">Mon QR MonWave</div>

    <div id="qrcode" style="display:flex;justify-content:center;margin:20px 0;"></div>

    <div style="font-size:13px;color:#8993a4;margin-bottom:18px;">
      Profil fictif MonWave
    </div>

    <button class="cancel" onclick="closeQR()">Fermer</button>
  </div>
</div>

<body>

<div class="app">

<header>
  <div class="brand">
  <span>MonWave <span class="demo">SIMULATION</span></span>
  <button onclick="openQR()" style="margin-left:10px;background:white;border:none;border-radius:10px;padding:7px 9px;font-size:18px;cursor:pointer;">▦</button>
</div>

  <div class="balance-label">Solde disponible</div>
  <div class="balance" id="balance">50 000 FCFA</div>
</header>

<main class="main">

  <div class="actions">
    <button class="action send" onclick="openModal('send')">
      💸 Envoyer
    </button>

    <button class="action withdraw" onclick="openModal('withdraw')">
      🏧 Retrait
    </button>
  </div>

  <div class="section-title">Historique</div>

  <div class="history" id="history"></div>

</main>

<footer>
  MonWave est une simulation fictive — aucune transaction réelle.
</footer>

</div>

<!-- Fenêtre opération -->
<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-title" id="modalTitle">
      Envoyer de l'argent
    </div>

    <div class="message" id="message"></div>

    <input
      type="text"
      id="phone"
      placeholder="Numéro de téléphone"
      inputmode="numeric"
    >

    <input
      type="number"
      id="amount"
      placeholder="Montant en FCFA"
      min="1"
    >

    <button class="confirm" onclick="confirmOperation()">
      Confirmer
    </button>

    <button class="cancel" onclick="closeModal()">
      Annuler
    </button>

  </div>

</div>

<script>

let balance = Number(localStorage.getItem("monwave_balance")) || 50000;

let history =
  JSON.parse(localStorage.getItem("monwave_history")) || [];

let operationType = "send";

function formatMoney(number) {
  return Number(number).toLocaleString("fr-FR") + " FCFA";
}

function updateBalance() {
  document.getElementById("balance").textContent =
    formatMoney(balance);

  localStorage.setItem("monwave_balance", balance);
}

function openModal(type) {

  operationType = type;

  document.getElementById("modal").style.display = "flex";

  document.getElementById("phone").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("message").style.display = "none";

  if (type === "send") {
    document.getElementById("modalTitle").textContent =
      "Envoyer de l'argent";
  } else {
    document.getElementById("modalTitle").textContent =
      "Effectuer un retrait";
  }
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function showMessage(text) {
  const box = document.getElementById("message");

  box.textContent = text;
  box.style.display = "block";
}

function confirmOperation() {

  const phone = document.getElementById("phone").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!phone) {
    showMessage("Entre un numéro de téléphone.");
    return;
  }

  if (!amount || amount <= 0) {
    showMessage("Entre un montant valide.");
    return;
  }

  if (amount > balance) {
    showMessage("Solde insuffisant.");
    return;
  }

  balance -= amount;

  const transaction = {
    type: operationType,
    phone: phone,
    amount: amount,
    date: new Date().toLocaleString("fr-FR")
  };

  history.unshift(transaction);

  localStorage.setItem(
    "monwave_history",
    JSON.stringify(history)
  );

  updateBalance();
  function openQR() {
    alert("QR code MonWave");
    }
  renderHistory();
  closeModal();
}

function renderHistory() {

  const container = document.getElementById("history");

  container.innerHTML = "";

  if (history.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Aucune opération pour le moment.
      </div>
    `;

    return;
  }

  history.forEach(transaction => {

    const div = document.createElement("div");

    div.className = "transaction";

    const title =
      transaction.type === "send"
      ? "Envoi"
      : "Retrait";

    const icon =
      transaction.type === "send"
      ? "↗️"
      : "🏧";

    div.innerHTML = `
      <div class="left">
        <div class="icon">${icon}</div>

        <div>
          <div class="name">
            ${title}
          </div>

          <div class="date">
            ${transaction.phone}<br>
            ${transaction.date}
          </div>
        </div>
      </div>

      <div class="amount">
        -${formatMoney(transaction.amount)}
      </div>
    `;

    container.appendChild(div);
  });
}

updateBalance();
renderHistory();

</script>

</body>
</html>
